<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sprouts Game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <h1>SPROUTS</h1>

    <div class="toolbar">
      <div class="controls game">
        <div class="node-count" role="group" aria-label="Nodes">
          <span id="nodeCountLabel">Nodes</span>
          <button id="fewerBtn" type="button" aria-label="Fewer nodes">&minus;</button>
          <input
            id="nodeCount"
            type="number"
            inputmode="numeric"
            min="2"
            max="24"
            value="4"
            aria-labelledby="nodeCountLabel"
          />
          <button id="moreBtn" type="button" aria-label="More nodes">+</button>
        </div>
        <button id="startBtn">New Game</button>
        <button id="undoBtn" disabled>Undo</button>
      </div>

      <div class="controls setup">
        <div class="toggle" role="group" aria-label="Who moves first">
          <button data-first="human" aria-pressed="true">You start</button>
          <button data-first="ai" aria-pressed="false">AI starts</button>
        </div>
        <div id="turn" data-player="human">
          <span class="swatch" aria-hidden="true"></span>
          <span id="turnText">Your turn</span>
        </div>
      </div>
    </div>

    <div class="status-row">
      <div id="status" role="status" aria-live="polite">Initializing...</div>
      <button id="cancelBtn" hidden>Cancel</button>
    </div>

    <div class="play-area">
      <div class="canvas-container">
        <div id="board" tabindex="-1">
          <canvas id="canvas" role="img" aria-label="Game board"></canvas>
          <div id="nodeTargets" role="group" aria-label="Nodes"></div>
        </div>
      </div>

      <aside id="history" aria-label="Move list" hidden>
        <div class="history-nav">
          <button id="backBtn" disabled>Back</button>
          <button id="forwardBtn" disabled>Forward</button>
          <button id="shareBtn">Share</button>
        </div>
        <ol id="moveList"></ol>
        <input id="shareUrl" type="text" readonly aria-label="Share link" hidden />
      </aside>
    </div>

    <div
      id="gameOverModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="winnerText"
    >
      <div class="modal-content">
        <h2 id="winnerText"></h2>
        <p>Game Over</p>
        <div class="modal-actions">
          <button id="reviewBtn">Review Board</button>
          <button id="newGameBtn">New Game</button>
        </div>
      </div>
    </div>

    <script type="module" src="/web/main.ts"></script>
  </body>
</html>

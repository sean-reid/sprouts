<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Sprouts Game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <h1>SPROUTS</h1>

    <div class="controls">
      <button data-nodes="4">4 Nodes</button>
      <button data-nodes="5">5 Nodes</button>
      <button data-nodes="6">6 Nodes</button>
      <button id="undoBtn" disabled>Undo</button>
    </div>

    <div class="controls setup">
      <div class="toggle" role="group" aria-label="Who moves first">
        <button data-first="human" aria-pressed="true">You start</button>
        <button data-first="ai" aria-pressed="false">AI starts</button>
      </div>
      <div id="turn" data-player="human">
        <span class="swatch" aria-hidden="true"></span>
        <span id="turnText">Your turn</span>
      </div>
    </div>

    <div id="status" role="status" aria-live="polite">Initializing...</div>

    <div class="canvas-container">
      <canvas id="canvas"></canvas>
    </div>

    <div id="mobileOverlay">
      <button id="cancelBtn">Cancel</button>
      <button id="confirmBtn" class="confirm-btn">Confirm Move</button>
    </div>

    <div id="gameOverModal" class="modal">
      <div class="modal-content">
        <h2 id="winnerText"></h2>
        <p>Game Over</p>
        <div class="modal-actions">
          <button id="reviewBtn">Review Board</button>
          <button id="newGameBtn">New Game</button>
        </div>
      </div>
    </div>

    <script type="module" src="/web/main.ts"></script>
  </body>
</html>

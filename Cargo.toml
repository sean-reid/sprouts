[package]
name = "sprouts"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5", default-features = false, features = ["js"] }

[dev-dependencies]
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[features]
debug_validation = []

[profile.release]
opt-level = 3
lto = true

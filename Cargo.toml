[package]
name = "sprouts"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5", default-features = false, features = ["js"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[features]
debug_validation = []
bench = ["dep:serde_json"]

[[bench]]
name = "replay"
harness = false
required-features = ["bench"]

[profile.release]
opt-level = 3
lto = true
